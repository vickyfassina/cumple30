<meta charset="utf-8">

<title>Rod · Cande · Vicky · Yas cumplen 30</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: light;
  --paper:#ebe6da; --ink:#141414; --mustard:#e8b33a;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:#cfc9bb;font-family:'DM Sans',system-ui,sans-serif;color:var(--ink);display:flex;justify-content:center;overflow-x:hidden}
.card{
  position:relative;width:100%;max-width:440px;min-height:100vh;background:var(--paper);overflow:hidden;
  background-image:radial-gradient(rgba(0,0,0,.045) 1px,transparent 1.2px),radial-gradient(rgba(255,255,255,.35) 1px,transparent 1.2px);
  background-size:7px 7px,11px 11px;background-position:0 0,3px 4px;padding:20px 12px 36px;
}
.stage{position:relative;width:100%;aspect-ratio:1080/1240;max-width:420px;margin:0 auto}

/* stickers */
.sticker{
  position:absolute;width:var(--w);left:var(--x);top:var(--y);transform:rotate(var(--r));
  cursor:pointer;border:0;padding:0;background:none;z-index:2;
  transition:transform .25s cubic-bezier(.3,1.6,.5,1);
}
.sticker img{display:block;width:100%;height:auto;filter:drop-shadow(0 4px 5px rgba(0,0,0,.28))}
.sticker:hover,.sticker:focus-visible,.sticker.pop{transform:rotate(var(--r)) scale(1.1);z-index:5}
.sticker:focus-visible,.bl:focus-visible{outline:3px solid var(--ink);outline-offset:3px}

/* globos */
.bl{position:absolute;left:var(--x);top:var(--y);width:var(--w);aspect-ratio:240/540;z-index:3;cursor:pointer;will-change:transform}
.bl .in{width:100%;height:100%;transform-origin:50% 60%;animation:sway 4.2s ease-in-out infinite alternate}
.bl svg{display:block;width:100%;height:100%;overflow:visible;filter:drop-shadow(0 10px 8px rgba(0,0,0,.25))}
.str{fill:none;stroke:#8b9097;stroke-width:2.5;stroke-linecap:round}
.knot{fill:#8b9097}
@keyframes sway{from{transform:rotate(-2.5deg) translateY(0)}to{transform:rotate(2.5deg) translateY(-8px)}}
.flying{pointer-events:none}

/* texto */
h1{font-family:Anton,Impact,'Arial Black','Helvetica Neue',Arial,sans-serif;font-weight:900;-webkit-text-stroke:.7px var(--ink);text-align:center;margin:8px 0 14px;font-size:clamp(30px,9.4vw,41px);line-height:1;letter-spacing:.01em;white-space:nowrap}
.date{display:flex;align-items:center;justify-content:center;gap:10px;margin:0 auto 12px;max-width:340px}
.date i{flex:1;height:1px;background:var(--ink);opacity:.55}
.date small{font-size:.66rem;letter-spacing:.2em;text-transform:uppercase}
.date b{font-family:Anton,Impact,'Arial Black','Helvetica Neue',Arial,sans-serif;font-weight:900;font-size:2.1rem;line-height:1}
.where{text-align:center;font-size:.85rem;line-height:1.5;margin:0 0 20px}
.where a{color:inherit}
.cta{
  display:block;width:max-content;margin:0 auto;text-align:center;text-decoration:none;color:var(--ink);
  font-weight:700;font-size:.78rem;letter-spacing:.16em;text-transform:uppercase;padding:14px 26px;
  border:2px solid var(--ink);border-radius:999px;background:var(--mustard);box-shadow:4px 4px 0 var(--ink);
  transition:transform .15s,box-shadow .15s;
}
.cta:hover{transform:translate(-1px,-1px);box-shadow:6px 6px 0 var(--ink)}
.cta:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
.cta:focus-visible{outline:3px solid var(--ink);outline-offset:4px}
.hint{text-align:center;font-size:.72rem;opacity:.6;margin:14px 0 0}
.bit{position:fixed;top:0;left:0;width:9px;height:14px;z-index:99;pointer-events:none;will-change:transform,opacity}
@media (prefers-reduced-motion:reduce){.bl .in{animation-duration:7s}}
</style>
</head>

<script>
var reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
var stage = document.getElementById('stage');
var bls = Array.prototype.slice.call(document.querySelectorAll('.bl'));
var busy = false;

document.querySelectorAll('.sticker').forEach(function(s){
  s.addEventListener('click', function(){
    s.classList.add('pop'); setTimeout(function(){ s.classList.remove('pop'); }, 450);
  });
});

// Los globos suben desde abajo (sin depender de promesas, para que ande en cualquier celu)
function undo(list){ list.forEach(function(x){ try{ x.cancel(); }catch(e){} }); }
function rise(delayBase){
  var card = stage.parentNode, anims = [];
  bls.forEach(function(b, i){
    var from = card.clientHeight - stage.offsetTop - b.offsetTop + 20;
    anims.push(b.animate([{transform:'translate(0,'+from+'px)'},{transform:'translate(0,0)'}],
      {duration:2600, delay:delayBase + i*250, easing:'cubic-bezier(.2,.9,.25,1)', fill:'both'}));
  });
  return {ms: 2600 + delayBase + (bls.length-1)*250 + 100, anims: anims};
}

// Por si el navegador no soporta animate(): sube y baja con transiciones CSS
function launchFallback(){
  bls.forEach(function(b, i){
    b.style.transition = 'transform 3.2s ease-in ' + (i*0.25) + 's';
    b.style.transform = 'translateY(-' + (stage.offsetTop + b.offsetTop + b.offsetHeight + 80) + 'px)';
  });
  setTimeout(function(){
    bls.forEach(function(b){ b.style.transition = 'none'; b.style.transform = 'translateY(' + (stage.parentNode.clientHeight) + 'px)'; });
    void stage.offsetWidth;
    bls.forEach(function(b, i){ b.style.transition = 'transform 2.6s cubic-bezier(.2,.9,.25,1) ' + (i*0.25) + 's'; b.style.transform = 'translateY(0)'; });
    setTimeout(function(){ bls.forEach(function(b){ b.style.transition = ''; b.style.transform = ''; }); busy = false; }, 3300);
  }, 4300);
}

// Los globos se van volando y vuelven a subir
function launch(){
  if(busy) return; busy = true;
  setTimeout(function(){ busy = false; }, 14000);
  if(!Element.prototype.animate){ launchFallback(); return; }
  var flights = [];
  try{
    bls.forEach(function(b, i){
      var dist = stage.offsetTop + b.offsetTop + b.offsetHeight + 80;
      var dx = i ? 46 : -40, rot = reduce ? 0 : (i ? 9 : -9);
      b.classList.add('flying');
      flights.push(b.animate([
        {transform:'translate(0,0) rotate(0deg)'},
        {transform:'translate('+(dx*.5)+'px,'+(-dist*.35)+'px) rotate('+rot+'deg)', offset:.4},
        {transform:'translate('+dx+'px,'+(-dist)+'px) rotate('+(-rot)+'deg)'}
      ],{duration:3200 + i*500, delay:i*250, easing:'cubic-bezier(.45,.05,.8,.5)', fill:'forwards'}));
    });
  }catch(e){ undo(flights); launchFallback(); return; }
  setTimeout(function(){
    var r;
    try{ r = rise(0); }catch(e){ r = {ms:0, anims:[]}; }
    setTimeout(function(){
      undo(flights); undo(r.anims);
      bls.forEach(function(b){ b.classList.remove('flying'); });
      busy = false;
    }, r.ms + 50);
  }, 3950 + 900);
}
bls.forEach(function(b){
  b.addEventListener('click', launch);
  b.addEventListener('keydown', function(e){ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); launch(); } });
});

var colors = ['#e8b33a','#d63a2a','#a9adb3','#141414','#f4f5f7','#3a8f5c'];
function confetti(x, y){
  if(reduce) return;
  for(var i=0;i<46;i++){
    var d = document.createElement('div');
    d.className = 'bit';
    d.style.background = colors[i % colors.length];
    d.style.borderRadius = i % 3 === 0 ? '50%' : '2px';
    document.body.appendChild(d);
    var a = Math.random()*Math.PI*2, v = 90 + Math.random()*180;
    var dx = Math.cos(a)*v, dy = Math.sin(a)*v - 120, rot = (Math.random()-.5)*900;
    d.animate([
      {transform:'translate('+x+'px,'+y+'px) rotate(0)',opacity:1},
      {transform:'translate('+(x+dx)+'px,'+(y+dy+260)+'px) rotate('+rot+'deg)',opacity:0}
    ],{duration:1100+Math.random()*700,easing:'cubic-bezier(.2,.7,.4,1)'}).onfinish = (function(el){ return function(){ el.remove(); }; })(d);
  }
}
document.getElementById('cta').addEventListener('click', function(e){
  confetti(e.clientX || innerWidth/2, e.clientY || innerHeight/2);
  launch();
});

function fitTitle(){
  var t=document.querySelector('h1'); t.style.fontSize='';
  var fs=parseFloat(getComputedStyle(t).fontSize), w=t.parentNode.clientWidth-24;
  while(t.scrollWidth>w && fs>14){ fs-=1; t.style.fontSize=fs+'px'; }
}
fitTitle(); addEventListener('resize',fitTitle);
if(document.fonts&&document.fonts.ready){ document.fonts.ready.then(fitTitle); }
try{
  busy = true;
  var r0 = rise(150);
  setTimeout(function(){ undo(r0.anims); busy = false; }, r0.ms + 50);
}catch(e){ busy = false; }
</script>
